<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Impressora FDM estilizada">
  <!--
    Open3DCalc — original artwork (CC-BY-4.0 project license).
    Stylized cartesian FDM printer: frame, gantry, extruder and bed.
    Uses currentColor so it adapts to light/dark themes automatically.
    NOT a manufacturer logo.
  -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Frame -->
    <rect x="4.5" y="3" width="15" height="18" rx="1.6" />
    <!-- Top crossbar (gantry) -->
    <line x1="4.5" y1="8" x2="19.5" y2="8" />
    <!-- Extruder carriage + hotend -->
    <rect x="9.6" y="6.2" width="4.8" height="2.4" rx="0.7" />
    <line x1="12" y1="8.6" x2="12" y2="10.4" />
    <line x1="11" y1="10.4" x2="13" y2="10.4" />
    <!-- Nozzle tip -->
    <path d="M11.2 10.4 L12 11.4 L12.8 10.4" />
    <!-- Print bed -->
    <line x1="6.6" y1="18.6" x2="17.4" y2="18.6" />
    <!-- Partially printed layer on the bed -->
    <path d="M9.4 18.6 v-1.8 h5.2 v1.8" />
  </g>
  <!-- Accent: heated nozzle + molten filament dot -->
  <circle cx="12" cy="11.9" r="0.85" fill="currentColor" opacity="0.85" />
</svg>
