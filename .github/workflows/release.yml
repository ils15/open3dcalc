# Release workflow v2 — tag-only push + PR strategy
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump type (auto = detect from commits)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  release-linux:
    runs-on: [self-hosted, cx33, linux]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3 2>/dev/null || true

      - name: Setup Wine (Windows cross-compile)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 2>/dev/null || true

      - name: Bump version with changelogen
        run: |
          if [ "${{ inputs.bump }}" = "auto" ]; then
            npx changelogen --bump
          else
            npx changelogen --bump --${{ inputs.bump }}
          fi

      - name: Build all targets
        run: |
          npm run build:all
          npm run build:electron

      - name: Electron-builder (Windows + Linux)
        run: npx electron-builder --win --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=v$(node -p "require('./package.json').version")
          BRANCH="release/$VERSION"
          git add package.json package-lock.json CHANGELOG.md 2>/dev/null || true
          git add -A
          git commit --no-verify -m "chore(release): $VERSION"
          git tag "$VERSION"
          if [ -n "${{ secrets.RELEASE_TOKEN }}" ]; then
            git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}.git
          fi
          # Push tag only — tags bypass branch protection
          git push origin "$VERSION"
          # Push commit to release/v<VERSION> branch (not protected)
          git push origin "HEAD:$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=v$(node -p "require('./package.json').version")
          echo "Creating release $VERSION..."
          
          # Collect artifacts as an array
          ARTIFACTS=()
          for f in dist-electron/Open3DCalc-*.exe dist-electron/Open3DCalc-*.AppImage; do
            if [ -f "$f" ]; then
              echo "  Found: $f ($(du -h "$f" | cut -f1))"
              ARTIFACTS+=("$f")
            fi
          done

          # Also include latest.yml/latest-linux.yml and .blockmap files for auto-updater
          for f in dist-electron/latest*.yml dist-electron/*.blockmap; do
            if [ -f "$f" ]; then
              echo "  Found: $f ($(du -h "$f" | cut -f1))"
              ARTIFACTS+=("$f")
            fi
          done
          
          if [ ${#ARTIFACTS[@]} -gt 0 ]; then
            echo "Creating release with ${#ARTIFACTS[@]} artifact(s)..."
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --target ${{ github.sha }} \
              "${ARTIFACTS[@]}"
          else
            echo "No artifacts found, creating release without artifacts..."
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --target ${{ github.sha }}
          fi
          echo "✅ Release created: https://github.com/ils15/open3dcalc/releases/tag/$VERSION"

      - name: Create PR for version bump to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=v$(node -p "require('./package.json').version")
          BRANCH="release/$VERSION"
          echo "Creating PR from $BRANCH → main..."
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): $VERSION" \
            --body "Automated release PR.

- Version bumped to **$VERSION**
- CHANGELOG updated
- Release artifacts published: https://github.com/${{ github.repository }}/releases/tag/$VERSION

Merge this PR when CI passes to apply the version bump to \`main\`." \
            --label release
          echo "✅ PR created for $BRANCH → main"
