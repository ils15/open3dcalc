name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump type (auto = detect from commits)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: [self-hosted, cx33, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3 2>/dev/null || true

      - name: Setup Wine (Windows cross-compile)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 2>/dev/null || true

      - name: Bump version with changelogen
        run: |
          if [ "${{ inputs.bump }}" = "auto" ]; then
            npx changelogen --bump
          else
            npx changelogen --bump --${{ inputs.bump }}
          fi

      - name: 🤖 Themis Pre-Release Review
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://llm.ofertachina.cloud/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'opencode-zen/deepseek-v4-flash' }}
        run: |
          # Get diff from last release tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            DIFF=$(git diff "$LAST_TAG"...HEAD -- . | head -c 80000)
            [ -z "$DIFF" ] && echo "No diff since $LAST_TAG — skipping review" && exit 0

            echo "Running Themis pre-release code review..."
            curl -s "$LLM_BASE_URL/chat/completions" \
              -H "Authorization: Bearer $LLM_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg diff "$DIFF" '{
                model: env.LLM_MODEL,
                messages: [
                  {role: "system", content: "You are Themis. Review this diff for CRITICAL issues only. Return JSON with: has_critical_issues (bool), summary (string), findings array."},
                  {role: "user", content: "Pre-release review:\n\($diff)"}
                ],
                response_format: {type: "json_object"}
              }')" > /tmp/themis-release-review.json

            SCRIPT_B64=""
            echo "$SCRIPT_B64" | base64 -d | python3
          else:
            echo "No previous tag found — skipping Themis review"
            exit 0

      - name: Build all targets
        run: |
          npm run build:all
          npm run build:electron

      - name: Electron-builder (Windows + Linux)
        run: npx electron-builder --win --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit, tag and force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=v$(node -p "require('./package.json').version")
          git add package.json package-lock.json CHANGELOG.md 2>/dev/null || true
          git add -A
          git commit --no-verify -m "chore(release): $VERSION [skip ci]"
          git tag "$VERSION"
          if [ -n "${{ secrets.RELEASE_TOKEN }}" ]; then
            git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/ils15/open3dcalc.git
          fi
          git push --force --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=v$(node -p "require('./package.json').version")
          echo "Creating release $VERSION..."
          
          # Collect artifacts as an array
          ARTIFACTS=()
          for f in dist-electron/Open3DCalc-*.exe dist-electron/Open3DCalc-*.AppImage; do
            if [ -f "$f" ]; then
              echo "  Found: $f ($(du -h "$f" | cut -f1))"
              ARTIFACTS+=("$f")
            fi
          done

          # Also include latest.yml/latest-linux.yml and .blockmap files for auto-updater
          for f in dist-electron/latest*.yml dist-electron/*.blockmap; do
            if [ -f "$f" ]; then
              echo "  Found: $f ($(du -h "$f" | cut -f1))"
              ARTIFACTS+=("$f")
            fi
          done
          
          if [ ${#ARTIFACTS[@]} -gt 0 ]; then
            echo "Creating release with ${#ARTIFACTS[@]} artifact(s)..."
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --target ${{ github.sha }} \
              "${ARTIFACTS[@]}"
          else
            echo "No artifacts found, creating release without artifacts..."
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --target ${{ github.sha }}
          fi
          echo "✅ Release created: https://github.com/ils15/open3dcalc/releases/tag/$VERSION"
