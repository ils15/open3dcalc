name: Release preparation

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to prepare (v1.10.0 is intentionally not supported)
        required: true
        type: choice
        default: patch
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: [self-hosted, cx33, linux]
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm rebuild better-sqlite3 2>/dev/null || true

      - name: Prepare version and changelog
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          case "$BUMP" in
            auto) npm exec -- changelogen --bump ;;
            patch|minor|major) npm exec -- changelogen --bump --"$BUMP" ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac

          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" = "v1.10.0" ]; then
            echo "v1.10.0 is intentionally excluded from this automation." >&2
            exit 1
          fi
          BRANCH="release/$VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Release branch $BRANCH already exists; refusing to duplicate or overwrite it." >&2
            exit 1
          fi
          git switch -c "$BRANCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Validate changed release files
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED=$'package.json\npackage-lock.json\nCHANGELOG.md'
          while IFS= read -r file; do
            [ -z "$file" ] || grep -Fxq "$file" <<< "$ALLOWED" || {
              echo "Unexpected release change: $file" >&2
              exit 1
            }
          done < <(git diff --name-only)
          git add package.json package-lock.json CHANGELOG.md
          git diff --cached --check

      - name: Quality checks and application builds
        run: |
          npm run lint -- --max-warnings=0
          npm run typecheck
          npm run test:run
          npm run build:all
          npm run build:electron

      - name: Commit and push release branch
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No version or changelog changes were produced; refusing an empty release PR." >&2
            exit 1
          fi
          git commit --no-verify -m "chore(release): $VERSION"
          git push origin "HEAD:$BRANCH"

      - name: Create or reuse release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --repo "$REPOSITORY" --state open --head "$BRANCH" --json number,url --jq '.[0] // empty')
          if [ -n "$EXISTING" ]; then
            echo "Release PR already exists; reusing it: $EXISTING"
            exit 0
          fi
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): $VERSION" \
            --body "Automated release preparation for $VERSION. Merge this PR after CI passes; then create the immutable tag $VERSION on the merged commit to publish."
