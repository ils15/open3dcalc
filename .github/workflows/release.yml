---
name: Release preparation

"on":
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Version bump to prepare (v1.10.0 is intentionally not supported)
        required: true
        type: choice
        default: patch
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Ensure gh CLI available
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "Installing gh CLI..."
            sudo mkdir -p -m 755 /etc/apt/keyrings
            wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          gh --version

      - name: Install dependencies
        run: |
          npm ci
          if ! npm rebuild better-sqlite3; then
            echo "better-sqlite3 rebuild failed on this runner; release
            preparation cannot continue." >&2
            exit 1
          fi

      - name: Prepare version and changelog
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPOSITORY="${{ github.repository }}"
          mapfile -t EXISTING_BRANCHES < <(
            gh api --paginate "repos/$REPOSITORY/branches?per_page=100" \
              --jq '.[].name' \
              | awk '/^release\/v[0-9]+\.[0-9]+\.[0-9]+$/'
          )
          if [ "${#EXISTING_BRANCHES[@]}" -gt 1 ]; then
            printf '%s\n' \
              "Multiple release branches exist; resolve explicitly before " \
              "rerun: " \
              "${EXISTING_BRANCHES[*]}" >&2
            exit 1
          fi
          if [ "${#EXISTING_BRANCHES[@]}" -eq 1 ]; then
            BRANCH="${EXISTING_BRANCHES[0]}"
            VERSION="${BRANCH#release/}"
            [ "$VERSION" != "v1.10.0" ] || {
              echo "v1.10.0 is intentionally excluded from this automation." >&2
              exit 1
            }
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
            git switch --track "origin/$BRANCH"
            message="Reusing existing $BRANCH; changelog/version are not bumped"
            printf '%s again.\n' "$message"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$BUMP" in
            auto) npm exec -- changelogen --bump ;;
            patch|minor|major) npm exec -- changelogen --bump --"$BUMP" ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac

          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" = "v1.10.0" ]; then
            echo "v1.10.0 is intentionally excluded from this automation." >&2
            exit 1
          fi
          BRANCH="release/$VERSION"
          git switch -c "$BRANCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "reused=false" >> "$GITHUB_OUTPUT"

      - name: Sync in-app changelog
        shell: bash
        run: node scripts/sync-changelog.mjs --write

      - name: Validate changed release files
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED=$'package.json\npackage-lock.json\nCHANGELOG.md\nsrc/shared/i18n/locales/pt-BR.json\nsrc/shared/i18n/locales/en-US.json'
          while IFS= read -r file; do
            [ -z "$file" ] || grep -Fxq "$file" <<< "$ALLOWED" || {
              echo "Unexpected release change: $file" >&2
              exit 1
            }
          done < <(git diff --name-only)
          if [ "${{ steps.version.outputs.reused }}" != "true" ]; then
            git add package.json package-lock.json CHANGELOG.md src/shared/i18n/locales/pt-BR.json src/shared/i18n/locales/en-US.json
            git diff --cached --check
          fi

      - name: Quality checks and application builds
        run: |
          npm run lint -- --max-warnings=0
          npm run typecheck
          npm run test:run
          npm run build:all
          npm run build:electron

      - name: Commit and push release branch
        if: steps.version.outputs.reused != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            printf '%s\n' \
              "No version or changelog changes were produced; refusing an " \
              "empty release PR." >&2
            exit 1
          fi
          git commit --no-verify -m "chore(release): $VERSION"
          git push origin "HEAD:$BRANCH"

      - name: Create or reuse release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
           EXISTING=$(gh pr list --repo "$REPOSITORY" --state open \
             --head "$BRANCH" --json number,url --jq '.[0] // empty')
          if [ -n "$EXISTING" ]; then
            echo "Release PR already exists; reusing it: $EXISTING"
            exit 0
          fi
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): $VERSION" \
            --body "Automated release preparation for $VERSION. Merge this PR "\
              "after CI passes; then create the immutable tag $VERSION on the "\
              "merged commit to publish."
