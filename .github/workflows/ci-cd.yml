---
name: CI/CD

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, cx33, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: 🔒 Secret scan (gitleaks)
        run: |
          if command -v gitleaks &>/dev/null; then
            gitleaks detect --no-git --source . -v || exit 1
          else
            echo "⚠️ gitleaks not installed on runner — skipping"
          fi
      - name: 📦 Dependency audit
        run: npm audit --omit=optional --audit-level=critical
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3
      - name: 🔍 Lint
        run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run test:run -- --coverage
      - name: Upload coverage
        if: always() && hashFiles('coverage/') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: 🔔 Notify failure
        if: failure()
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "❌ CI/CD failed: $REPO@$REF"
          echo "  https://github.com/$REPO/actions/runs/$RUN_ID"

  build-web:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cx33, linux]
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - run: npm run build:web
      - name: SPA routing fix
        run: |
          cp -n dist-web/index.web.html dist-web/404.html 2>/dev/null || true
          cp -n dist-web/index.web.html dist-web/index.html 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v4

  build-desktop:
    needs: quality
    runs-on: [self-hosted, cx33, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: Rebuild native modules
        run: >-
          if ! npm rebuild better-sqlite3; then
            echo "better-sqlite3 rebuild failed on this runner; refusing to
            continue with the desktop build." >&2;
            exit 1;
          fi
      - run: npm run build:desktop
      - name: Verify desktop build
        run: ls -la dist/
