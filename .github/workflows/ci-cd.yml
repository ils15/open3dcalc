---
name: CI/CD

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # NOTE: runs on fork PRs too — public ubuntu-latest runner, read-only
    # token, no writable secrets. Required check for external contributors.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: 🔒 Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 📦 Dependency audit
        run: npm audit --omit=optional --audit-level=critical
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3
      - name: 🔍 Lint
        run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - name: 🔔 Notify failure
        if: failure()
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "❌ CI/CD failed: $REPO@$REF"
          echo "  https://github.com/$REPO/actions/runs/$RUN_ID"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3
      - run: npm run test:run -- --coverage
      - name: 🔔 Notify failure
        if: failure()
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "❌ CI/CD failed: $REPO@$REF"
          echo "  https://github.com/$REPO/actions/runs/$RUN_ID"
      - name: Upload coverage
        if: always() && hashFiles('coverage/') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/

  build-web:
    needs: [checks, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - run: npm run build:web
      - name: SPA routing fix
        run: |
          cp -n dist-web/index.web.html dist-web/404.html 2>/dev/null || true
          cp -n dist-web/index.web.html dist-web/index.html 2>/dev/null || true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  build-desktop:
    needs: [checks, test]
    # Fork guard (same as the quality job): for PR workflows github.ref is
    # refs/pull/<number>/merge, so a ref-based condition would skip the
    # desktop build on every PR. Run on trusted pushes to main AND same-repo
    # PRs; NEVER on fork PRs (which run on untrusted runners).
    if: |
      github.event_name != 'pull_request' ||
      (github.head_ref != '' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: Rebuild native modules
        run: >-
          if ! npm rebuild better-sqlite3; then
            echo "better-sqlite3 rebuild failed on this runner; refusing to
            continue with the desktop build." >&2;
            exit 1;
          fi
      - run: npm run build:desktop
      - name: Verify desktop build
        run: ls -la dist/
