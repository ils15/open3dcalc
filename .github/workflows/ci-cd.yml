name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, cx33, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: 🔒 Security scan (secrets)
        run: |
          GITLEAKS_VERSION="v8.18.2"
          GITLEAKS_BIN="/tmp/gitleaks"
          
          if [ ! -x "$GITLEAKS_BIN" ]; then
            echo "Installing gitleaks ${GITLEAKS_VERSION}..."
            curl -sL \
              "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks-linux-amd64" \
              -o "$GITLEAKS_BIN" || {
              echo "⚠️ Gitleaks download failed — skipping scan"
              exit 0
            }
            chmod +x "$GITLEAKS_BIN"
          fi
          
          echo "Running gitleaks secret scan..."
          "$GITLEAKS_BIN" detect --source . --verbose --no-git 2>&1 || {
            echo "╳ Secrets detected!"
            exit 1
          }
          echo "  ✓ No secrets detected"
      - name: 🗄️ Validate DB migrations
        run: |
          echo "Running DB migrations..."
          export OPEN3DCALC_DB_PATH=/tmp/test-open3dcalc.db
          npm run db:migrate 2>&1 || {
            echo "❌ DB migration failed!"
            exit 1
          }
          echo "  ✓ Migrations applied successfully"
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3 2>/dev/null || true
      - name: 🔍 Lint
        run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run test:run -- --coverage
      - name: Upload coverage
        if: always() && hashFiles('coverage/') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: 🔔 Notify failure
        if: failure()
        run: |
          echo "❌ CI/CD failed: ${{ github.repository }}@${{ github.ref_name }}"
          echo "  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  build-web:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cx33, linux]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - run: npm run build:web
      - name: SPA routing fix
        run: cp -n dist-web/index.web.html dist-web/404.html 2>/dev/null || true && cp -n dist-web/index.web.html dist-web/index.html 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v4

  build-desktop:
    needs: quality
    runs-on: [self-hosted, cx33, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3 2>/dev/null || true
      - run: npm run build:desktop
      - name: Verify desktop build
        run: ls -la dist/
