name: 🤖 Themis AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: [self-hosted, cx33, linux]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔍 AI Code Review via Themis
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://llm.ofertachina.cloud/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'opencode-zen/deepseek-v4-flash' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- . || echo "")
          [ -z "$DIFF" ] && echo "No diff to review" && exit 0
          DIFF=$(echo "$DIFF" | head -c 80000)

          echo "Sending diff to Bifrost LLM for review..."
          curl -s "$LLM_BASE_URL/chat/completions" \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg diff "$DIFF" '{
              model: env.LLM_MODEL,
              messages: [
                {role: "system", content: "You are Themis, an AI code reviewer. Analyze the diff for: bugs, security vulnerabilities, performance issues, and best practices. Return a JSON object with a findings array. Each finding has: severity (critical/high/medium/low), file, line, message, and suggestion."},
                {role: "user", content: "Review this diff:\n\($diff)"}
              ],
              response_format: {type: "json_object"}
            }')" > /tmp/themis-response.json

      - name: 📝 Post Review Comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCRIPT_B64=""
          echo "$SCRIPT_B64" | base64 -d > /tmp/themis-post-comments.py
          python3 /tmp/themis-post-comments.py
