name: AI Code Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    timeout-minutes: 10
    runs-on: [self-hosted, cx33, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: AI Review via CX33 service
        id: cx33-review
        continue-on-error: true
        run: |
          curl -s --retry 3 --retry-delay 5 --max-time 60 \
            -X POST https://infra.ofertachina.cloud/review/webhook \
            -H "Content-Type: application/json" \
            -d '{
              "event": "pull_request",
              "delivery_id": "${{ github.event.delivery }}",
              "payload": {
                "repository": {"full_name": "${{ github.repository }}"},
                "pull_request": {
                  "number": ${{ github.event.pull_request.number }},
                  "title": "${{ github.event.pull_request.title }}",
                  "body": "${{ github.event.pull_request.body }}"
                }
              }
            }' > /tmp/cx33-review-result.json 2>/tmp/cx33-review-stderr.log
          echo "✅ CX33 review completed"

      - name: Fallback to OCR CLI
        if: steps.cx33-review.outcome == 'failure' || steps.cx33-review.outcome == 'skipped'
        env:
          OCR_API_KEY: ${{ secrets.BF_VIRTUAL_KEY }}
        run: |
          npm install -g @alibaba-group/open-code-review
          ocr config set provider custom
          ocr config set custom_providers.custom.url https://llm.ofertachina.cloud/v1
          ocr config set custom_providers.custom.protocol openai
          ocr config set custom_providers.custom.api_key "$OCR_API_KEY"
          ocr config set custom_providers.custom.model opencode-zen/deepseek-v4-flash-free
          ocr config set language English
          ocr review \
            --from "origin/${{ github.base_ref }}" \
            --to "origin/${{ github.head_ref }}" \
            --format json \
            > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Try CX33 result first
            const cx33Success = '${{ steps.cx33-review.outcome }}' === 'success';
            if (cx33Success) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '## 🤖 AI Code Review (CX33)\n\n✅ Review completed by DeepSeek V4 Flash via Bifrost',
              });
              return;
            }

            // Fallback to existing OCR logic
            let ocrResult;
            try {
              ocrResult = JSON.parse(fs.readFileSync('/tmp/ocr-result.json', 'utf8'));
            } catch (parseErr) {
              const stderr = fs.readFileSync('/tmp/ocr-stderr.log', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 AI Code Review\n\n**Error parsing OCR output:**\n\`\`\`\n${parseErr.message}\n\`\`\`\n\n**Stderr:**\n\`\`\`\n${stderr || '(empty)'}\n\`\`\``,
              });
              return;
            }

            const comments = ocrResult.comments || [];

            if (comments.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '## 🤖 AI Code Review\n\n✅ No issues found',
              });
              return;
            }

            const reviewComments = [];
            const summaryComments = [];

            for (const comment of comments) {
              const bodyParts = [];
              if (comment.content) bodyParts.push(comment.content);
              if (comment.existing_code) {
                bodyParts.push('**Existing code:**\n```\n' + comment.existing_code + '\n```');
              }
              if (comment.suggestion_code) {
                bodyParts.push('**Suggested code:**\n```\n' + comment.suggestion_code + '\n```');
              }
              const body = bodyParts.join('\n\n');

              if (comment.path && (comment.start_line || comment.end_line)) {
                reviewComments.push({
                  path: comment.path,
                  start_line: comment.start_line || comment.end_line,
                  end_line: comment.end_line || comment.start_line,
                  body: body,
                });
              } else {
                summaryComments.push(body);
              }
            }

            const summaryBody = summaryComments.length > 0
              ? '## 🤖 AI Code Review\n\n' + summaryComments.join('\n\n---\n\n')
              : '## 🤖 AI Code Review';

            try {
              if (reviewComments.length > 0) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  event: 'COMMENT',
                  body: summaryBody,
                  comments: reviewComments,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: summaryBody,
                });
              }
            } catch (reviewErr) {
              // Fallback: post individual comments for each finding
              for (const comment of comments) {
                const fallbackBody = ['## 🤖 AI Code Review'];
                if (comment.path) fallbackBody.push(`**File:** \`${comment.path}\``);
                if (comment.content) fallbackBody.push(comment.content);
                if (comment.existing_code) {
                  fallbackBody.push('**Existing code:**\n```\n' + comment.existing_code + '\n```');
                }
                if (comment.suggestion_code) {
                  fallbackBody.push('**Suggested code:**\n```\n' + comment.suggestion_code + '\n```');
                }

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: fallbackBody.join('\n\n'),
                });
              }
            }
