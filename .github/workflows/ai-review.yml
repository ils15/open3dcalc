name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install alibaba/open-code-review
        run: npm install -g @alibaba-group/open-code-review

      - name: Configure OCR
        run: |
          ocr config set provider custom
          ocr config set custom_providers.custom.url https://llm.ofertachina.cloud/v1
          ocr config set custom_providers.custom.protocol openai
          ocr config set custom_providers.custom.api_key ${{ secrets.BF_VIRTUAL_KEY }}
          ocr config set custom_providers.custom.model opencode-zen/deepseek-v4-flash-free
          ocr config set language English

      - name: Run OCR review
        run: |
          ocr review \
            --from "origin/${{ github.base_ref }}" \
            --to "origin/${{ github.head_ref }}" \
            --format json \
            > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log || true

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let ocrResult;
            try {
              ocrResult = JSON.parse(fs.readFileSync('/tmp/ocr-result.json', 'utf8'));
            } catch (parseErr) {
              const stderr = fs.readFileSync('/tmp/ocr-stderr.log', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 AI Code Review\n\n**Error parsing OCR output:**\n\`\`\`\n${parseErr.message}\n\`\`\`\n\n**Stderr:**\n\`\`\`\n${stderr || '(empty)'}\n\`\`\``,
              });
              return;
            }

            const comments = ocrResult.comments || [];

            if (comments.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '## 🤖 AI Code Review\n\n✅ No issues found',
              });
              return;
            }

            const reviewComments = [];
            const summaryComments = [];

            for (const comment of comments) {
              const bodyParts = [];
              if (comment.content) bodyParts.push(comment.content);
              if (comment.existing_code) {
                bodyParts.push('**Existing code:**\n```\n' + comment.existing_code + '\n```');
              }
              if (comment.suggestion_code) {
                bodyParts.push('**Suggested code:**\n```\n' + comment.suggestion_code + '\n```');
              }
              const body = bodyParts.join('\n\n');

              if (comment.path && (comment.start_line || comment.end_line)) {
                reviewComments.push({
                  path: comment.path,
                  start_line: comment.start_line || comment.end_line,
                  end_line: comment.end_line || comment.start_line,
                  body: body,
                });
              } else {
                summaryComments.push(body);
              }
            }

            const summaryBody = summaryComments.length > 0
              ? '## 🤖 AI Code Review\n\n' + summaryComments.join('\n\n---\n\n')
              : '## 🤖 AI Code Review';

            try {
              if (reviewComments.length > 0) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  event: 'COMMENT',
                  body: summaryBody,
                  comments: reviewComments,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: summaryBody,
                });
              }
            } catch (reviewErr) {
              // Fallback: post individual comments for each finding
              for (const comment of comments) {
                const fallbackBody = ['## 🤖 AI Code Review'];
                if (comment.path) fallbackBody.push(`**File:** \`${comment.path}\``);
                if (comment.content) fallbackBody.push(comment.content);
                if (comment.existing_code) {
                  fallbackBody.push('**Existing code:**\n```\n' + comment.existing_code + '\n```');
                }
                if (comment.suggestion_code) {
                  fallbackBody.push('**Suggested code:**\n```\n' + comment.suggestion_code + '\n```');
                }

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: fallbackBody.join('\n\n'),
                });
              }
            }
