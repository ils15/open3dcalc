name: Beta release

# Validation runs without credentials and checks hook gates directly. The
# publisher is a fresh runner with no checkout or project code; it creates only
# the exact validated main commit's beta tag.

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/beta.yml
      - .github/workflows/beta-deploy.yml

permissions: {}

concurrency:
  group: beta-channel
  cancel-in-progress: false

jobs:
  validate:
    name: Validate beta candidate without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    env:
      BASH_ENV: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Fetch public candidate anonymously
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            echo "❌ Expected a fresh workspace for anonymous checkout." >&2
            exit 1
          fi
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]] || {
                echo "❌ Unexpected pull request ref: $GITHUB_REF." >&2
                exit 1
              }
              fetch_ref="$GITHUB_REF"
              target_ref=refs/remotes/origin/pr-validation
              ;;
            workflow_dispatch)
              fetch_ref=refs/heads/main
              target_ref=refs/remotes/origin/main
              ;;
            *)
              echo "❌ Unsupported beta validation event:" \
                "$GITHUB_EVENT_NAME." >&2
              exit 1
              ;;
          esac
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "+$fetch_ref:$target_ref"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            '+refs/tags/*:refs/tags/*'
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$target_ref"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # The hook requires Gitleaks. This trusted step installs a checksum-pinned
      # binary before any npm lifecycle or project code runs.
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASH_ENV: /dev/null
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      # All candidate npm lifecycle, hooks, and quality gates run in a pinned,
      # disposable container. The only host mounts are read-only: the checkout,
      # setup-node's Node 22 runtime, and the checksum-pinned Gitleaks binary.
      # No GitHub command files, runner temp, Docker socket, secrets, or writable
      # host path are exposed to candidate code. Container output is prefixed
      # before logging so it cannot issue runner commands.
      - name: Run candidate pre-commit and quality gates in isolation
        id: candidate-validation
        shell: bash
        env:
          BASH_ENV: /dev/null
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          candidate_sha="$GITHUB_SHA"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          candidate_head_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          test "$candidate_head_sha" = "$candidate_sha"
          candidate_tree_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse "$candidate_sha^{tree}")
          candidate_index_tree=$(env -u GIT_INDEX_FILE git -C "$GITHUB_WORKSPACE" write-tree)
          test "$candidate_index_tree" = "$candidate_tree_sha"
          [ -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all)" ] || {
            echo "❌ Candidate checkout is not clean before isolated validation." >&2
            exit 1
          }

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "❌ Beta releases must be dispatched from main (got $GITHUB_REF)." >&2
              exit 1
            fi
            git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            test "$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/main)" = "$candidate_sha"
            gate_base_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse "$candidate_sha^1")
            commit_shas=("$candidate_sha")
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            git -C "$GITHUB_WORKSPACE" cat-file -e "$PR_BASE_SHA^{commit}"
            git -C "$GITHUB_WORKSPACE" cat-file -e "$PR_HEAD_SHA^{commit}"
            git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$PR_BASE_SHA" "$candidate_sha"
            git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$PR_HEAD_SHA" "$candidate_sha"
            gate_base_sha="$PR_BASE_SHA"
            mapfile -t commit_shas < <(
              git -C "$GITHUB_WORKSPACE" rev-list --reverse "$PR_BASE_SHA..$PR_HEAD_SHA"
            )
            ((${#commit_shas[@]} > 0)) || {
              echo "❌ Pull request contains no candidate commits to validate." >&2
              exit 1
            }
          else
            echo "❌ Unsupported beta validation event: $GITHUB_EVENT_NAME." >&2
            exit 1
          fi
          for commit_sha in "${commit_shas[@]}"; do
            [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          done

          version=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== lock.version || pkg.version !== lock.packages?.['']?.version) {
            throw new Error('package.json and package-lock.json versions do not match');
          }
          if (!/^\d+\.\d+\.\d+-beta\.\d+$/.test(pkg.version)) {
            throw new Error(`Expected X.Y.Z-beta.N, got ${pkg.version}`);
          }
          process.stdout.write(pkg.version);
          NODE
          )
          beta_tag="v$version"
          if git -C "$GITHUB_WORKSPACE" show-ref --verify --quiet "refs/tags/$beta_tag"; then
            echo "❌ Beta tag $beta_tag already exists; beta tags are immutable." >&2
            exit 1
          fi

          node_root=$(dirname -- "$(dirname -- "$(readlink -f -- "$(command -v node)")")")
          case "$node_root/" in
            "$RUNNER_TOOL_CACHE"/node/*/x64/) ;;
            *)
              echo "❌ setup-node runtime is outside the expected hosted tool cache: $node_root." >&2
              exit 1
              ;;
          esac
          [[ "$(node -p 'process.versions.node.split(".")[0]')" = 22 ]]
          [ -x "$node_root/bin/npm" ]
          gitleaks_bin="$RUNNER_TEMP/gitleaks-bin/gitleaks"
          [ -x "$gitleaks_bin" ]
          command -v docker >/dev/null 2>&1
          docker info >/dev/null

          verify_host_candidate_state() {
            local phase="$1" current_head current_tree index_tree dirty_paths
            current_head=$(env -u GIT_INDEX_FILE git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
            current_tree=$(env -u GIT_INDEX_FILE git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')
            index_tree=$(env -u GIT_INDEX_FILE git -C "$GITHUB_WORKSPACE" write-tree)
            dirty_paths=$(env -u GIT_INDEX_FILE git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all)
            if [ "$current_head" != "$candidate_sha" ] || \
               [ "$current_tree" != "$candidate_tree_sha" ] || \
               [ "$index_tree" != "$candidate_index_tree" ] || \
               [ -n "$dirty_paths" ]; then
              echo "❌ Host candidate checkout changed $phase." >&2
              printf 'HEAD=%s\nTREE=%s\nINDEX=%s\n' \
                "$current_head" "$current_tree" "$index_tree" >&2
              printf '%s\n' "${dirty_paths:-clean}" >&2
              return 1
            fi
          }

          # No provider credential crosses into candidate execution. The
          # deterministic scanner still runs; its separate AI subcheck skips.
          container_status=0
          validation_log="$RUNNER_TEMP/beta-validation-$GITHUB_RUN_ID.log"
          container_image='mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27'
          if docker run --rm --init --platform linux/amd64 \
            --security-opt=no-new-privileges:true \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/input,readonly" \
            --mount "type=bind,source=$node_root,target=/node,readonly" \
            --mount "type=bind,source=$gitleaks_bin,target=/tools/gitleaks,readonly" \
            --env 'PATH=/node/bin:/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' \
            --env HOME=/tmp/beta-home \
            --env TMPDIR=/tmp/beta-tmp \
            --env NPM_CONFIG_CACHE=/tmp/npm-cache \
            --env CI=true \
            --env BASH_ENV=/dev/null \
            --env GIT_CONFIG_NOSYSTEM=1 \
            --env GIT_CONFIG_GLOBAL=/dev/null \
            --env GIT_TERMINAL_PROMPT=0 \
            --env BF_VIRTUAL_KEY= \
            --env "CANDIDATE_SHA=$candidate_sha" \
            --env "CANDIDATE_TREE_SHA=$candidate_tree_sha" \
            --env "CANDIDATE_INDEX_TREE=$candidate_index_tree" \
            --env "GATE_BASE_SHA=$gate_base_sha" \
            --env "COMMIT_SHAS=$(printf '%s\n' "${commit_shas[@]}")" \
            --env "BETA_TAG=$beta_tag" \
            --workdir /tmp \
            --entrypoint /bin/bash \
            "$container_image" \
            --noprofile --norc -euo pipefail -s >"$validation_log" 2>&1 <<'CONTAINER'
          set -euo pipefail
          test -z "$(env | grep '^GITHUB_' || true)" || {
            echo '❌ GitHub runner variables unexpectedly crossed the container boundary.' >&2
            exit 1
          }
          test "$(node -p 'process.versions.node.split(".")[0]')" = 22
          test -x /tools/gitleaks
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends build-essential

          work=/tmp/beta-work
          test "$(id -u)" = 0
          build_account=$(getent passwd pwuser) || {
            echo '❌ Pinned Playwright image is missing the expected pwuser account.' >&2
            exit 1
          }
          IFS=: read -r build_user _ build_uid build_gid _ _ _ <<< "$build_account"
          if [[ "$build_user" != pwuser || ! "$build_uid" =~ ^[1-9][0-9]*$ || \
                ! "$build_gid" =~ ^[1-9][0-9]*$ ]] || \
             ! getent group "$build_gid" >/dev/null || \
             [[ "$(id -u "$build_user")" != "$build_uid" || \
                "$(id -g "$build_user")" != "$build_gid" ]]; then
            echo '❌ Pinned Playwright image has an invalid pwuser UID/GID mapping.' >&2
            exit 1
          fi
          install -d -m 700 -o "$build_uid" -g "$build_gid" \
            "$work" /tmp/beta-home /tmp/beta-tmp /tmp/npm-cache
          cp -a /input/. "$work/"
          chown -R "$build_uid:$build_gid" "$work"

          runuser --user "$build_user" -- /usr/bin/env -i \
            PATH="$PATH" \
            HOME=/tmp/beta-home \
            TMPDIR=/tmp/beta-tmp \
            NPM_CONFIG_CACHE=/tmp/npm-cache \
            CI=true \
            BASH_ENV=/dev/null \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_TERMINAL_PROMPT=0 \
            BF_VIRTUAL_KEY= \
            CANDIDATE_SHA="$CANDIDATE_SHA" \
            CANDIDATE_TREE_SHA="$CANDIDATE_TREE_SHA" \
            CANDIDATE_INDEX_TREE="$CANDIDATE_INDEX_TREE" \
            GATE_BASE_SHA="$GATE_BASE_SHA" \
            COMMIT_SHAS="$COMMIT_SHAS" \
            BETA_TAG="$BETA_TAG" \
            /bin/bash --noprofile --norc -euo pipefail -s <<'PROJECT'
          set -euo pipefail
          cd /tmp/beta-work
          test "$(id -u)" -ne 0
          [[ "$(node -p 'process.versions.node.split(".")[0]')" = 22 ]]
          test -z "$(env | grep '^GITHUB_' || true)"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          candidate_head_sha=$(env -u GIT_INDEX_FILE git rev-parse HEAD)
          candidate_tree_sha=$(env -u GIT_INDEX_FILE git rev-parse "$CANDIDATE_SHA^{tree}")
          candidate_index_tree=$(env -u GIT_INDEX_FILE git write-tree)
          test "$candidate_head_sha" = "$CANDIDATE_SHA"
          test "$candidate_tree_sha" = "$CANDIDATE_TREE_SHA"
          test "$candidate_index_tree" = "$CANDIDATE_INDEX_TREE"

          verify_candidate_state() {
            local phase="$1" current_head current_tree index_tree dirty_paths
            if ! current_head=$(env -u GIT_INDEX_FILE git rev-parse HEAD) ||
               [ "$current_head" != "$candidate_head_sha" ]; then
              echo "❌ Candidate HEAD changed $phase (expected $candidate_head_sha, got ${current_head:-unavailable})." >&2
              return 1
            fi
            if ! current_tree=$(env -u GIT_INDEX_FILE git rev-parse 'HEAD^{tree}') ||
               [ "$current_tree" != "$candidate_tree_sha" ]; then
              echo "❌ Candidate tree changed $phase (expected $candidate_tree_sha, got ${current_tree:-unavailable})." >&2
              return 1
            fi
            if ! index_tree=$(env -u GIT_INDEX_FILE git write-tree) ||
               [ "$index_tree" != "$candidate_index_tree" ]; then
              echo "❌ Candidate index changed $phase (expected $candidate_index_tree, got ${index_tree:-unavailable})." >&2
              return 1
            fi
            if ! env -u GIT_INDEX_FILE git diff --quiet "$CANDIDATE_SHA" --; then
              echo "❌ Candidate source diff detected $phase." >&2
              return 1
            fi
            if ! dirty_paths=$(env -u GIT_INDEX_FILE git status --porcelain --untracked-files=all) ||
               [ -n "$dirty_paths" ]; then
              echo "❌ Candidate checkout is dirty $phase." >&2
              printf '%s\n' "${dirty_paths:-status unavailable}" >&2
              return 1
            fi
          }

          run_verified_gate() {
            local gate_name="$1"
            shift
            verify_candidate_state "before $gate_name"
            "$@"
            verify_candidate_state "after $gate_name"
          }

          run_verified_gate 'pinned base..candidate Gitleaks scan' \
            bash scripts/scan-hosted-gitleaks.sh

          npm ci
          verify_candidate_state 'after npm ci'

          for name in SKIP_GITLEAKS SKIP_ENV_GUARD SKIP_BIFROST_EXPOSURE SKIP_HYGIENE SKIP_PUSH_GATE HUSKY; do
            [ -z "${!name-}" ] || {
              echo "❌ Unexpected hook bypass variable: $name." >&2
              exit 1
            }
          done
          run_verified_gate 'pre-commit hook' \
            bash scripts/hosted-pre-commit.sh

          mapfile -t commit_shas <<< "$COMMIT_SHAS"
          ((${#commit_shas[@]} > 0))
          verify_candidate_state 'before commitlint'
          for commit_sha in "${commit_shas[@]}"; do
            [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
            subject=$(git show -s --format=%s "$commit_sha")
            case "$subject" in
              'Merge branch'*|'Merge remote-tracking'*|'Merge pull request'*)
                echo "Skipping commitlint for merge commit $commit_sha, as the local hook does."
                ;;
              *)
                git show -s --format=%B "$commit_sha" | npx --no-install commitlint
                ;;
            esac
          done
          verify_candidate_state 'after commitlint'

          run_verified_gate 'typecheck' npm run typecheck
          run_verified_gate 'Electron typecheck' npm run typecheck:electron
          run_verified_gate 'lint' npm run lint -- --max-warnings=0
          run_verified_gate 'Prettier' npx --no-install prettier --check .github/workflows/beta.yml .github/workflows/beta-deploy.yml
          run_verified_gate 'build' npm run build:all

          gate_report='node_modules/.cache/push-gate/vitest.json'
          mkdir -p "$(dirname "$gate_report")"
          verify_candidate_state 'before Vitest'
          vitest_status=0
          npm run test:run -- --reporter=default --reporter=json \
            "--outputFile.json=$gate_report" || vitest_status=$?
          vitest_integrity_status=0
          verify_candidate_state 'after Vitest' || vitest_integrity_status=$?
          comparator_pre_integrity_status=0
          verify_candidate_state 'before push-gate comparator' || comparator_pre_integrity_status=$?
          comparator_status=0
          node scripts/push-gate.mjs "$gate_report" || comparator_status=$?
          comparator_integrity_status=0
          verify_candidate_state 'after push-gate comparator' || comparator_integrity_status=$?
          if [ "$vitest_status" -ne 0 ] || [ "$comparator_status" -ne 0 ] ||
             [ "$vitest_integrity_status" -ne 0 ] || [ "$comparator_pre_integrity_status" -ne 0 ] ||
             [ "$comparator_integrity_status" -ne 0 ]; then
            echo "❌ Validation failed (Vitest=$vitest_status, comparator=$comparator_status, integrity=$((vitest_integrity_status + comparator_pre_integrity_status + comparator_integrity_status)))." >&2
            exit 1
          fi
          echo "✅ Pre-commit and configured validation gates completed for $BETA_TAG at $CANDIDATE_SHA."
          PROJECT
          CONTAINER
          then
            :
          else
            container_status=$?
          fi
          while IFS= read -r line || [ -n "$line" ]; do
            printf '[isolated-container] %s\n' "$line"
          done < "$validation_log"

          verify_host_candidate_state 'after isolated validation'
          if [ "$container_status" -ne 0 ]; then
            echo "❌ Isolated candidate validation failed with exit code $container_status." >&2
            exit "$container_status"
          fi
          echo "✅ Pre-commit and configured validation gates completed for $beta_tag at $candidate_sha."

      - name: Summarize secret-free validation
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.candidate-validation.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VALIDATION_OUTCOME" in
            success|failure|cancelled|skipped) ;;
            *) echo "❌ Unexpected candidate validation outcome: $VALIDATION_OUTCOME." >&2; exit 1 ;;
          esac
          {
            printf '## Beta candidate validation\n\n'
            printf -- '- Isolated validation step: `%s`.\n' "$VALIDATION_OUTCOME"
            if [ "$VALIDATION_OUTCOME" = success ]; then
              printf '%s\n' '- Deterministic secret checks: Gitleaks and the local pre-commit checks (environment-file guard, staged-diff heuristic, and hygiene) ran via `sh .husky/pre-commit`; this does not imply the Bifrost AI subcheck ran.'
            else
              printf '%s\n' '- Deterministic secret checks: Gitleaks and local pre-commit checks are configured in `sh .husky/pre-commit`, but completion is not asserted because isolated validation did not succeed.'
            fi
            printf '%s\n' '- Bifrost AI exposure subcheck: **NOT RUN** — this validation is intentionally secret-free, with no Bifrost credential supplied to candidate code. Its fail-open policy makes it advisory, not a required release gate; the skipped subcheck is not a pass.'
            printf '%s\n' '- Scope: this workflow invokes the pre-commit hook, not the `commit-msg` or `pre-push` hooks. Review validation logs for scanner warnings; the scanner has fail-open error paths.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-tag:
    name: Publish validated beta tag
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: beta-release
    permissions:
      contents: read
    steps:
      # No checkout, dependency install, or repository script runs in this job.
      - name: Verify candidate manifests, main ancestry, and tag availability
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          BASE_SHA: ${{ github.sha }}
          BASH_ENV: /dev/null
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "❌ Refusing publication outside main (got $GITHUB_REF)." >&2
            exit 1
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          api_root="$API_URL/repos/$GITHUB_REPOSITORY"
          api_get() {
            local path="$1" destination="$2" status
            status=$(curl --silent --show-error --output "$destination" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api_root/$path")
            if [ "$status" != 200 ]; then
              echo "❌ GitHub API GET $path returned HTTP $status." >&2
              exit 1
            fi
          }

          package_response=$(mktemp "$RUNNER_TEMP/package.XXXXXX")
          lock_response=$(mktemp "$RUNNER_TEMP/lock-response.XXXXXX")
          package_json=$(mktemp "$RUNNER_TEMP/package-json.XXXXXX")
          lock_json=$(mktemp "$RUNNER_TEMP/lock-json.XXXXXX")
          api_get "contents/package.json?ref=$BASE_SHA" "$package_response"
          api_get "contents/package-lock.json?ref=$BASE_SHA" "$lock_response"
          jq -er '.content' "$package_response" | tr -d '\n' | base64 --decode > "$package_json"
          jq -er '.content' "$lock_response" | tr -d '\n' | base64 --decode > "$lock_json"
          package_version=$(jq -er '.version' "$package_json")
          lock_version=$(jq -er '.version' "$lock_json")
          lock_root_version=$(jq -er '.packages[""].version' "$lock_json")
          if [ "$package_version" != "$lock_version" ] || \
             [ "$package_version" != "$lock_root_version" ] || \
             ! [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "❌ Candidate manifests do not contain one beta X.Y.Z-beta.N version." >&2
            exit 1
          fi
          tag="v$package_version"

          tag_response=$(mktemp "$RUNNER_TEMP/tag-ref.XXXXXX")
          status=$(curl --silent --show-error --output "$tag_response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api_root/git/ref/tags/$tag")
          case "$status" in
            404) ;;
            200) echo "❌ Beta tag $tag already exists; beta tags are immutable." >&2; exit 1 ;;
            *) echo "❌ GitHub API tag check returned HTTP $status." >&2; exit 1 ;;
          esac

          main_json=$(mktemp "$RUNNER_TEMP/main-ref.XXXXXX")
          api_get "git/ref/heads/main" "$main_json"
          main_sha=$(jq -er '.object.sha' "$main_json")
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          comparison=$(mktemp "$RUNNER_TEMP/main-ancestry.XXXXXX")
          api_get "compare/$BASE_SHA...$main_sha" "$comparison"
          compare_status=$(jq -er '.status' "$comparison")
          merge_base_sha=$(jq -er '.merge_base_commit.sha' "$comparison")
          if [[ "$compare_status" != ahead && "$compare_status" != identical ]] || \
             [ "$merge_base_sha" != "$BASE_SHA" ]; then
            echo "❌ Validated candidate is not an ancestor of current main." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Verified $tag at exact candidate SHA $BASE_SHA; current main is $main_sha."

      # This is the only step receiving BETA_RELEASE_TOKEN. The API creates
      # refs/tags/<tag> directly at the exact validated candidate SHA; an
      # existing ref or concurrent create fails closed.
      - name: Create immutable beta tag ref
        env:
          GH_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
          TAG: ${{ steps.verify.outputs.tag }}
          CANDIDATE_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
          BASH_ENV: /dev/null
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ Secret BETA_RELEASE_TOKEN is not configured for the protected beta-release environment." >&2
            exit 1
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          payload=$(jq -cn --arg ref "refs/tags/$TAG" --arg sha "$CANDIDATE_SHA" \
            '{ref: $ref, sha: $sha}')
          response=$(mktemp "$RUNNER_TEMP/create-tag.XXXXXX")
          status=$(curl --silent --show-error --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$API_URL/repos/$GITHUB_REPOSITORY/git/refs")
          if [ "$status" != 201 ]; then
            echo "❌ GitHub API tag creation returned HTTP $status." >&2
            cat "$response" >&2
            exit 1
          fi
          echo "Created $TAG for exact candidate commit $CANDIDATE_SHA."
