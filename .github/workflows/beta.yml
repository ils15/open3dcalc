name: Beta release

# Validation runs without credentials and exercises the repository's actual
# Husky hooks. The publisher is a fresh runner with no checkout or project code;
# it creates only the exact validated main commit's beta tag.

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/beta.yml

permissions: {}

concurrency:
  group: beta-channel
  cancel-in-progress: false

jobs:
  validate:
    name: Validate beta candidate without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    env:
      BASH_ENV: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Fetch public candidate anonymously
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            echo "❌ Expected a fresh workspace for anonymous checkout." >&2
            exit 1
          fi
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]] || {
                echo "❌ Unexpected pull request ref: $GITHUB_REF." >&2
                exit 1
              }
              fetch_ref="$GITHUB_REF"
              target_ref=refs/remotes/origin/pr-validation
              ;;
            workflow_dispatch)
              fetch_ref=refs/heads/main
              target_ref=refs/remotes/origin/main
              ;;
            *)
              echo "❌ Unsupported beta validation event:" \
                "$GITHUB_EVENT_NAME." >&2
              exit 1
              ;;
          esac
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "+$fetch_ref:$target_ref"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            '+refs/tags/*:refs/tags/*'
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$target_ref"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # The hook requires Gitleaks. This trusted step installs a checksum-pinned
      # binary before any npm lifecycle or project code runs.
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASH_ENV: /dev/null
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      # All npm-controlled commands execute as a dedicated unprivileged user.
      # The current step's actual runner command-file directory is made
      # inaccessible to that user (not overridden or redirected). A canary
      # proves GITHUB_ENV/PATH/OUTPUT/STATE/SUMMARY writes fail and that a
      # BASH_ENV payload cannot persist changes. The publisher consumes no
      # outputs or artifacts from this job--only its success result.
      - name: Install and run actual commit, commit-msg, and pre-push hooks
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail

          base_sha="$GITHUB_SHA"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "❌ Beta releases must be dispatched from main (got $GITHUB_REF)." >&2
              exit 1
            fi
            git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$base_sha"
            test "$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/main)" = "$base_sha"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
            test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$base_sha"
          else
            echo "❌ Unsupported beta validation event:" \
              "$GITHUB_EVENT_NAME." >&2
            exit 1
          fi

          version=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== lock.version || pkg.version !== lock.packages?.['']?.version) {
            throw new Error('package.json and package-lock.json versions do not match');
          }
          if (!/^\d+\.\d+\.\d+-beta\.\d+$/.test(pkg.version)) {
            throw new Error(`Expected X.Y.Z-beta.N, got ${pkg.version}`);
          }
          process.stdout.write(pkg.version);
          NODE
          )
          beta_tag="v$version"
          if git -C "$GITHUB_WORKSPACE" show-ref --verify --quiet "refs/tags/$beta_tag"; then
            echo "❌ Beta tag $beta_tag already exists; beta tags are immutable." >&2
            exit 1
          fi

          command_paths=()
          for name in GITHUB_ENV GITHUB_PATH GITHUB_OUTPUT GITHUB_STATE GITHUB_STEP_SUMMARY; do
            value=${!name-}
            [ -n "$value" ] || {
              echo "❌ Runner did not provide required command file $name." >&2
              exit 1
            }
            [ -f "$value" ] && [ ! -L "$value" ] || {
              echo "❌ Runner command file $name is missing or not a regular file." >&2
              exit 1
            }
            for path in "${command_paths[@]}"; do
              [ "$value" != "$path" ] || {
                echo "❌ Runner command file $name duplicates path $value." >&2
                exit 1
              }
            done
            command_paths+=("$value")
          done
          command_dir=$(dirname "${command_paths[0]}")
          [ -d "$command_dir" ] && [ ! -L "$command_dir" ] || {
            echo "❌ Runner command-file directory is not a real directory." >&2
            exit 1
          }
          for path in "${command_paths[@]}"; do
            [ "$(dirname "$path")" = "$command_dir" ] || {
              echo "❌ Runner command files are not isolated in one directory." >&2
              exit 1
            }
            [ "$(stat -c '%h' "$path")" = 1 ] || {
              echo "❌ Runner command file $path has an unexpected hard link." >&2
              exit 1
            }
            [ "$(stat -c '%u' "$path")" = "$(id -u)" ] || {
              echo "❌ Runner command-file owner differs from this step user." >&2
              exit 1
            }
          done
          [ "$(stat -c '%u' "$command_dir")" = "$(id -u)" ] || {
            echo "❌ Runner command-file directory owner differs from this step user." >&2
            exit 1
          }
          chmod 700 "$command_dir"
          chmod 600 "${command_paths[@]}"

          run_id=${GITHUB_RUN_ID//[^0-9]/}
          [ -n "$run_id" ] || { echo "❌ Invalid workflow run id." >&2; exit 1; }
          sandbox_user="beta-gate-$run_id"
          sandbox_root="$RUNNER_TEMP/beta-gate-$run_id"
          # Use a unique directory directly under searchable /tmp. RUNNER_TEMP
          # may have private ancestors, which would make the immutable Git dir
          # appear missing to the isolated hook UID despite its own 0555 mode.
          trusted_root=""
          trusted_git=""
          guard_dir=""
          install_tree="$sandbox_root/work/install-tree"
          hook_tree="$sandbox_root/work/hook-tree"
          sandbox_home="$sandbox_root/home"
          canary_dir=""
          uid=""
          user_created=0

          cleanup() {
            if [ -n "$uid" ]; then
              sudo -n pkill -KILL -u "$uid" >/dev/null 2>&1 || true
            fi
            if [ "$user_created" = 1 ]; then
              sudo -n rm -rf -- "$sandbox_root"
              if [ -n "$trusted_root" ]; then
                sudo -n rm -rf -- "$trusted_root"
              fi
              sudo -n userdel "$sandbox_user" >/dev/null 2>&1 || true
            fi
            if [ -n "$canary_dir" ]; then
              rm -f -- "$canary_dir/canary.bashenv"
              rmdir -- "$canary_dir"
            fi
          }
          trap cleanup EXIT

          sudo -n true || {
            echo "❌ A passwordless runner privilege boundary is unavailable." >&2
            exit 1
          }
          sudo -n useradd --system --user-group --no-create-home \
            --shell /usr/sbin/nologin "$sandbox_user"
          user_created=1
          uid=$(id -u "$sandbox_user")
          gid=$(id -g "$sandbox_user")
          mkdir -m 755 "$sandbox_root"
          sudo -n install -d -m 755 -o "$uid" -g "$gid" \
            "$sandbox_home" "$sandbox_root/work"
          sudo -n install -d -m 700 -o "$uid" -g "$gid" \
            "$sandbox_root/tmp" "$sandbox_root/npm-cache"
          trusted_root=$(mktemp -d "/tmp/beta-trusted-$run_id.XXXXXXXX")
          trusted_git="$trusted_root/candidate.git"
          guard_dir="$trusted_root/hook-guards"
          git -C "$GITHUB_WORKSPACE" clone --bare --no-hardlinks . "$trusted_git"
          chmod -R a-w "$trusted_git"
          find "$trusted_git" -type d -exec chmod 555 {} +
          find "$trusted_git" -type f -exec chmod 444 {} +
          # Keep the mktemp directory private until the bare repo is immutable;
          # then permit traversal for read-only clones by the sandbox UID.
          chmod 755 "$trusted_root"

          sandbox_path="$RUNNER_TEMP/gitleaks-bin:$PATH"
          sandbox() {
            sudo -n -u "$sandbox_user" -- env -i \
              PATH="$sandbox_path" \
              HOME="$sandbox_home" \
              XDG_CONFIG_HOME="$sandbox_home/.config" \
              TMPDIR="$sandbox_root/tmp" \
              NPM_CONFIG_CACHE="$sandbox_root/npm-cache" \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_TERMINAL_PROMPT=0 \
              BASH_ENV=/dev/null \
              "$@"
          }
          sandbox_in_tree() {
            local tree="$1"
            shift
            sandbox /bin/bash -c 'cd "$1" && shift && exec "$@"' \
              sandbox-shell "$tree" "$@"
          }

          # The canary is only a harmless shell-variable marker. Keep BASH_ENV
          # scoped to the isolated subprocess; the runner shell must never source it.
          declare -A command_hashes=()
          for path in "${command_paths[@]}"; do
            command_hashes["$path"]=$(sha256sum "$path")
          done
          canary_dir=$(mktemp -d "/tmp/beta-bashenv-$run_id.XXXXXXXX")
          canary="$canary_dir/canary.bashenv"
          # /tmp is traversable by the runner-created sandbox UID. The private
          # RUNNER_TEMP parent may not be; never loosen its permissions.
          chmod 711 "$canary_dir"
          (umask 077; printf '%s\n' '__BETA_BASH_ENV_CANARY=loaded' > "$canary")
          chmod 444 "$canary"
          canary_bash_uid=$(sudo -n -u "$sandbox_user" -- id -u)
          if [ "$canary_bash_uid" != "$uid" ] || [ "$canary_bash_uid" = "$(id -u)" ]; then
            echo "❌ BASH_ENV child did not resolve to the isolated sandbox UID." >&2
            exit 1
          fi
          echo "BASH_ENV canary Bash runs as isolated UID $canary_bash_uid."
          [ -f "$canary" ] && [ ! -L "$canary" ] && [ -r "$canary" ] || {
            echo "❌ BASH_ENV marker is not a readable regular file for the runner." >&2
            exit 1
          }
          canary_parent="$canary"
          while [ "$canary_parent" != / ]; do
            canary_parent=$(dirname -- "$canary_parent")
            if ! sandbox /usr/bin/test -x "$canary_parent"; then
              echo "❌ BASH_ENV marker parent is not searchable by isolated UID $canary_bash_uid: $canary_parent" >&2
              exit 1
            fi
          done
          if ! sandbox /usr/bin/test -r "$canary"; then
            echo "❌ BASH_ENV marker is not readable by isolated UID $canary_bash_uid." >&2
            exit 1
          fi
          canary_env=(HOME="$sandbox_home" PATH="$sandbox_path" BASH_ENV="$canary")
          for name in GITHUB_ENV GITHUB_PATH GITHUB_OUTPUT GITHUB_STATE GITHUB_STEP_SUMMARY; do
            value=${!name-}
            [ -n "$value" ] || {
              echo "❌ Runner command file $name disappeared before canary execution." >&2
              exit 1
            }
            canary_env+=("$name=$value")
          done
          canary_status=0
          sudo -n -u "$sandbox_user" -- env -i "${canary_env[@]}" \
            /bin/bash -c '
              [ "$(id -u)" = "$1" ] || exit 95
              [ "${__BETA_BASH_ENV_CANARY:-}" = loaded ] || exit 93
              for name in GITHUB_ENV GITHUB_PATH GITHUB_OUTPUT GITHUB_STATE GITHUB_STEP_SUMMARY; do
                target=${!name-}
                [ -n "$target" ] || exit 94
                if printf "%s\\n" \
                  "BASH_ENV=/tmp/untrusted-startup" \
                  "SKIP_PUSH_GATE=1" \
                  "HUSKY=0" \
                  "PWNED=1" >> "$target" 2>/dev/null; then
                  exit 92
                fi
              done
            ' beta-bashenv-canary "$canary_bash_uid" || canary_status=$?
          unset canary_env
          if [ "$canary_status" -eq 92 ]; then
            echo "❌ Isolated canary could write a runner command file or bypass variable." >&2
            exit 1
          elif [ "$canary_status" -eq 93 ]; then
            echo "❌ BASH_ENV canary did not execute; isolation test is inconclusive." >&2
            exit 1
          elif [ "$canary_status" -eq 94 ]; then
            echo "❌ BASH_ENV canary did not receive every runner command file." >&2
            exit 1
          elif [ "$canary_status" -eq 95 ]; then
            echo "❌ BASH_ENV canary Bash ran under an unexpected UID." >&2
            exit 1
          elif [ "$canary_status" -ne 0 ]; then
            echo "❌ BASH_ENV canary harness failed with exit code $canary_status; isolation test is inconclusive." >&2
            exit 1
          fi
          for path in "${command_paths[@]}"; do
            [ "$(sha256sum "$path")" = "${command_hashes[$path]}" ] || {
              echo "❌ Isolated canary changed a runner command file." >&2
              exit 1
            }
          done

          verify_command_files() {
            local path
            for path in "${command_paths[@]}"; do
              [ "$(sha256sum "$path")" = "${command_hashes[$path]}" ] || {
                echo "❌ npm/hook code changed a runner command file." >&2
                return 1
              }
            done
          }

          sandbox git clone --no-checkout --no-hardlinks "$trusted_git" "$install_tree"
          sandbox git -C "$install_tree" checkout --quiet --detach "$base_sha"
          test "$(git -C "$install_tree" rev-parse HEAD)" = "$base_sha"
          sandbox_in_tree "$install_tree" npm ci

          # Stop any lifecycle daemon before the trusted post-install check.
          sudo -n pkill -KILL -u "$uid" >/dev/null 2>&1 || true
          if pgrep -u "$uid" >/dev/null 2>&1; then
            echo "❌ npm lifecycle process survived the sandbox boundary." >&2
            exit 1
          fi
          verify_command_files

          hook_sources=(
            .husky/pre-commit .husky/commit-msg .husky/pre-push
            scripts/scan-secrets-bifrost.mjs scripts/push-gate.mjs
            scripts/push-gate-baseline.json package.json package-lock.json
            commitlint.config.js .lintstagedrc.json eslint.config.js
          )
          verify_hook_sources() {
            local tree="$1" path
            for path in "${hook_sources[@]}"; do
              if [ ! -f "$tree/$path" ] || [ -L "$tree/$path" ] || \
                 ! git --git-dir="$trusted_git" cat-file blob "$base_sha:$path" \
                   | cmp --silent - "$tree/$path"; then
                echo "❌ Trusted hook source differs from candidate $base_sha:$path." >&2
                return 1
              fi
            done
          }
          verify_hook_sources "$install_tree"

          # Re-clone from immutable candidate objects after npm, so neither
          # lifecycle changes to .git nor its working-tree edits can become the
          # tree on which the actual hooks execute. Reuse only node_modules.
          sandbox git clone --no-checkout --no-hardlinks "$trusted_git" "$hook_tree"
          sandbox git -C "$hook_tree" checkout --quiet --detach "$base_sha"
          sandbox cp -a "$install_tree/node_modules" "$hook_tree/node_modules"
          verify_hook_sources "$hook_tree"

          sandbox mkdir -p "$sandbox_home/.config" "$sandbox_home/.config/husky"
          if [ -e "$sandbox_home/.huskyrc" ] || [ -e "$sandbox_home/.config/husky/init.sh" ]; then
            echo "❌ Unexpected user Husky init script." >&2
            exit 1
          fi
          sandbox_in_tree "$hook_tree" ./node_modules/.bin/husky
          sudo -n pkill -KILL -u "$uid" >/dev/null 2>&1 || true
          if pgrep -u "$uid" >/dev/null 2>&1; then
            echo "❌ Husky setup process survived the sandbox boundary." >&2
            exit 1
          fi

          hooks_path=$(git -C "$hook_tree" config --local --get-all core.hooksPath || true)
          if [ "$hooks_path" != ".husky/_" ]; then
            echo "❌ Unexpected Git hooksPath after Husky activation: $hooks_path" >&2
            exit 1
          fi
          for hook in pre-commit commit-msg pre-push; do
            wrapper="$hook_tree/.husky/_/$hook"
            if [ ! -f "$wrapper" ] || [ -L "$wrapper" ] || [ ! -x "$wrapper" ] || \
               ! printf '%s  %s\n' \
                 '34fe496008be71d8fdd446b2cce81e4bb0406109c130eafc583fbd9fe33244e2' \
                 "$wrapper" | sha256sum --check --status; then
              echo "❌ Husky wrapper integrity check failed: $hook" >&2
              exit 1
            fi
          done
          if [ ! -f "$hook_tree/.husky/_/h" ] || [ -L "$hook_tree/.husky/_/h" ] || \
             ! printf '%s  %s\n' \
               '70200b200ca709b0622784f93839a5b2872333a917a09afddefd7dc2d8cdc680' \
               "$hook_tree/.husky/_/h" | sha256sum --check --status; then
            echo "❌ Husky dispatcher integrity check failed." >&2
            exit 1
          fi

          mkdir -m 755 "$guard_dir"
          for hook in pre-commit commit-msg pre-push; do
            cat > "$guard_dir/$hook" <<'GUARD'
          #!/bin/sh
          set -eu
          hook=${0##*/}
          case "$hook" in
            pre-commit|commit-msg|pre-push) ;;
            *) echo "Unknown beta hook: $hook" >&2; exit 2 ;;
          esac
          [ "${BASH_ENV:-}" = /dev/null ] || { echo "Unexpected BASH_ENV" >&2; exit 2; }
          [ "${HUSKY:-}" != 0 ] || { echo "HUSKY bypass detected" >&2; exit 2; }
          [ ! -e "$HOME/.huskyrc" ] && [ ! -e "$HOME/.config/husky/init.sh" ] || {
            echo "Unexpected user Husky init script" >&2; exit 2;
          }
          [ "${SKIP_GITLEAKS:-}" != 1 ] && [ "${SKIP_ENV_GUARD:-}" != 1 ] && \
            [ "${SKIP_BIFROST_EXPOSURE:-}" != 1 ] && [ "${SKIP_HYGIENE:-}" != 1 ] && \
            [ "${SKIP_PUSH_GATE:-}" != 1 ] || { echo "Hook bypass detected" >&2; exit 2; }
          for path in \
            .husky/pre-commit .husky/commit-msg .husky/pre-push \
            scripts/scan-secrets-bifrost.mjs scripts/push-gate.mjs \
            scripts/push-gate-baseline.json package.json package-lock.json \
            commitlint.config.js .lintstagedrc.json eslint.config.js; do
            file="$BETA_HOOK_TREE/$path"
            [ -f "$file" ] && [ ! -L "$file" ] || { echo "Missing hook source: $path" >&2; exit 2; }
            /usr/bin/git --git-dir="$BETA_TRUSTED_GIT" cat-file blob "$BETA_BASE_SHA:$path" \
              | /usr/bin/cmp --silent - "$file" || { echo "Hook source changed: $path" >&2; exit 2; }
          done
          wrapper="$BETA_HOOK_TREE/.husky/_/$hook"
          [ -f "$wrapper" ] && [ ! -L "$wrapper" ] && [ -x "$wrapper" ] || exit 2
          printf '%s  %s\n' \
            '34fe496008be71d8fdd446b2cce81e4bb0406109c130eafc583fbd9fe33244e2' \
            "$wrapper" | /usr/bin/sha256sum --check --status || exit 2
          dispatcher="$BETA_HOOK_TREE/.husky/_/h"
          [ -f "$dispatcher" ] && [ ! -L "$dispatcher" ] || exit 2
          printf '%s  %s\n' \
            '70200b200ca709b0622784f93839a5b2872333a917a09afddefd7dc2d8cdc680' \
            "$dispatcher" | /usr/bin/sha256sum --check --status || exit 2
          exec "$wrapper" "$@"
          GUARD
            chmod 555 "$guard_dir/$hook"
          done
          chmod 555 "$guard_dir"

          sandbox git -C "$hook_tree" config user.name "github-actions[bot]"
          sandbox git -C "$hook_tree" config user.email "github-actions[bot]@users.noreply.github.com"
          sudo -n chown -R "$(id -u):$(id -g)" "$trusted_root" "$guard_dir"
          chmod -R a-w "$trusted_root"
          find "$trusted_root" -type d -exec chmod 555 {} +
          find "$trusted_root" -type f -exec chmod 444 {} +

          # Final source comparison after installation/activation, then the
          # immutable guard re-compares immediately before each real Husky hook.
          verify_hook_sources "$hook_tree"
          for hook in pre-commit commit-msg pre-push; do
            wrapper="$hook_tree/.husky/_/$hook"
            test -f "$wrapper" && test ! -L "$wrapper"
          done

          git_env=(
            BETA_TRUSTED_GIT="$trusted_git"
            BETA_BASE_SHA="$base_sha"
            BETA_HOOK_TREE="$hook_tree"
            HOME="$sandbox_home"
            XDG_CONFIG_HOME="$sandbox_home/.config"
            PATH="$sandbox_path"
            BASH_ENV=/dev/null
            GIT_CONFIG_NOSYSTEM=1
            GIT_CONFIG_GLOBAL=/dev/null
            GIT_TERMINAL_PROMPT=0
          )
          # Exercise the guard's exact bare-repo lookup as the isolated UID
          # with the same environment passed to Git (and inherited by hooks).
          if ! sudo -n -u "$sandbox_user" -- env -i "${git_env[@]}" \
            /bin/sh -eu -c \
            '/usr/bin/git --git-dir="$BETA_TRUSTED_GIT" cat-file -e "$BETA_BASE_SHA^{commit}"'; then
            echo "❌ Trusted candidate Git dir is not readable in the hook environment." >&2
            exit 1
          fi
          git_as_sandbox() {
            sudo -n -u "$sandbox_user" -- env -i "${git_env[@]}" \
              /usr/bin/git -C "$hook_tree" -c "core.hooksPath=$guard_dir" "$@"
          }
          git_as_sandbox commit --allow-empty -m "chore(beta): validate $beta_tag"
          git_as_sandbox reset --hard "$base_sha"

          remote="$sandbox_root/work/validation.git"
          sandbox /usr/bin/git init --bare "$remote"
          git_as_sandbox remote add beta-validation "$remote"
          git_as_sandbox push beta-validation "$base_sha:refs/heads/beta-validation"
          remote_sha=$(sandbox /usr/bin/git --git-dir="$remote" rev-parse refs/heads/beta-validation)
          test "$remote_sha" = "$base_sha"
          verify_command_files
          echo "✅ Actual hooks passed for $beta_tag at $base_sha."

          # No GITHUB_OUTPUT or artifact carries a value from npm/project code.

  publish-tag:
    name: Publish validated beta tag
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: beta-release
    permissions:
      contents: read
    steps:
      # No checkout, dependency install, or repository script runs in this job.
      - name: Verify candidate manifests, main ancestry, and tag availability
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          BASE_SHA: ${{ github.sha }}
          BASH_ENV: /dev/null
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "❌ Refusing publication outside main (got $GITHUB_REF)." >&2
            exit 1
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          api_root="$API_URL/repos/$GITHUB_REPOSITORY"
          api_get() {
            local path="$1" destination="$2" status
            status=$(curl --silent --show-error --output "$destination" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api_root/$path")
            if [ "$status" != 200 ]; then
              echo "❌ GitHub API GET $path returned HTTP $status." >&2
              exit 1
            fi
          }

          package_response=$(mktemp "$RUNNER_TEMP/package.XXXXXX")
          lock_response=$(mktemp "$RUNNER_TEMP/lock-response.XXXXXX")
          package_json=$(mktemp "$RUNNER_TEMP/package-json.XXXXXX")
          lock_json=$(mktemp "$RUNNER_TEMP/lock-json.XXXXXX")
          api_get "contents/package.json?ref=$BASE_SHA" "$package_response"
          api_get "contents/package-lock.json?ref=$BASE_SHA" "$lock_response"
          jq -er '.content' "$package_response" | tr -d '\n' | base64 --decode > "$package_json"
          jq -er '.content' "$lock_response" | tr -d '\n' | base64 --decode > "$lock_json"
          package_version=$(jq -er '.version' "$package_json")
          lock_version=$(jq -er '.version' "$lock_json")
          lock_root_version=$(jq -er '.packages[""].version' "$lock_json")
          if [ "$package_version" != "$lock_version" ] || \
             [ "$package_version" != "$lock_root_version" ] || \
             ! [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "❌ Candidate manifests do not contain one beta X.Y.Z-beta.N version." >&2
            exit 1
          fi
          tag="v$package_version"

          tag_response=$(mktemp "$RUNNER_TEMP/tag-ref.XXXXXX")
          status=$(curl --silent --show-error --output "$tag_response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api_root/git/ref/tags/$tag")
          case "$status" in
            404) ;;
            200) echo "❌ Beta tag $tag already exists; beta tags are immutable." >&2; exit 1 ;;
            *) echo "❌ GitHub API tag check returned HTTP $status." >&2; exit 1 ;;
          esac

          main_json=$(mktemp "$RUNNER_TEMP/main-ref.XXXXXX")
          api_get "git/ref/heads/main" "$main_json"
          main_sha=$(jq -er '.object.sha' "$main_json")
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          comparison=$(mktemp "$RUNNER_TEMP/main-ancestry.XXXXXX")
          api_get "compare/$BASE_SHA...$main_sha" "$comparison"
          compare_status=$(jq -er '.status' "$comparison")
          merge_base_sha=$(jq -er '.merge_base_commit.sha' "$comparison")
          if [[ "$compare_status" != ahead && "$compare_status" != identical ]] || \
             [ "$merge_base_sha" != "$BASE_SHA" ]; then
            echo "❌ Validated candidate is not an ancestor of current main." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Verified $tag at exact candidate SHA $BASE_SHA; current main is $main_sha."

      # This is the only step receiving BETA_RELEASE_TOKEN. The API creates
      # refs/tags/<tag> directly at the exact validated candidate SHA; an
      # existing ref or concurrent create fails closed.
      - name: Create immutable beta tag ref
        env:
          GH_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
          TAG: ${{ steps.verify.outputs.tag }}
          CANDIDATE_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
          BASH_ENV: /dev/null
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ Secret BETA_RELEASE_TOKEN is not configured for the protected beta-release environment." >&2
            exit 1
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          payload=$(jq -cn --arg ref "refs/tags/$TAG" --arg sha "$CANDIDATE_SHA" \
            '{ref: $ref, sha: $sha}')
          response=$(mktemp "$RUNNER_TEMP/create-tag.XXXXXX")
          status=$(curl --silent --show-error --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$API_URL/repos/$GITHUB_REPOSITORY/git/refs")
          if [ "$status" != 201 ]; then
            echo "❌ GitHub API tag creation returned HTTP $status." >&2
            cat "$response" >&2
            exit 1
          fi
          echo "Created $TAG for exact candidate commit $CANDIDATE_SHA."
