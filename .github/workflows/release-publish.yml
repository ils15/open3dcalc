---
name: Release publication

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.9.2)"
        required: true
        type: string
        default: "v1.9.2"

concurrency:
  group: release-publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, cx33, linux]
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout immutable tag commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure gh CLI available
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "Installing gh CLI..."
            sudo mkdir -p -m 755 /etc/apt/keyrings
            wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          gh --version

      - name: Resolve tag and SHA
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          TAG_SHA=$(git rev-list -n 1 "$TAG^{commit}")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify tag is immutable, merged, and matches package version
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          TAG_SHA: ${{ steps.resolve.outputs.tag_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          ACTUAL_SHA=$(git rev-list -n 1 "$TAG^{commit}")
          [ "$ACTUAL_SHA" = "$TAG_SHA" ] || {
            echo "Tag does not point to event commit." >&2
            exit 1
          }
          git merge-base --is-ancestor "$TAG_SHA" origin/main || {
            echo "Tag is not on merged main." >&2
            exit 1
          }
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          [ "$PACKAGE_VERSION" = "$TAG" ] || {
            printf '%s\n' \
              "Tag $TAG does not match package version $PACKAGE_VERSION." >&2
            exit 1
          }
          [ "$TAG" != "v1.10.0" ] || {
            echo "v1.10.0 is intentionally excluded from this automation." >&2
            exit 1
          }

      - name: Install and build release artifacts
        run: |
          npm ci
          npm rebuild better-sqlite3
          npm run lint -- --max-warnings=0
          npm run typecheck
          npm run test:run
          rm -rf dist-electron dist-web
          npm run build:all
          npm run build:electron
          if command -v sudo >/dev/null 2>&1; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y wine64 wine32
          fi
          npm exec -- electron-builder --win --linux --publish never

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          TAG_SHA: ${{ steps.resolve.outputs.tag_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ARTIFACTS < <(find dist-electron -maxdepth 1 -type f \( \
            -name 'Open3DCalc-*.exe' -o -name 'Open3DCalc-*.AppImage' -o \
            -name 'latest*.yml' -o -name '*.blockmap' \) -print)
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "No release artifacts found." >&2
            exit 1
          fi
          : > release-artifacts.sha256
           for artifact in "${ARTIFACTS[@]}"; do
             sha256sum "$artifact" >> release-artifacts.sha256
           done
          rm -rf release-publish-diagnostics
          mkdir -p release-publish-diagnostics
          RELEASE_JSON=release-publish-diagnostics/release.json
           if gh api "repos/$REPOSITORY/releases/tags/$TAG" \
             >"$RELEASE_JSON" 2>/dev/null; then
            RELEASE_ID=$(jq -r '.id' "$RELEASE_JSON")
            TAG_REF=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
             [ "$TAG_REF" = "$TAG_SHA" ] || {
               echo "Existing release tag resolves to $TAG_REF, expected "
                 "$TAG_SHA; preserving release." >&2
               exit 1
             }
             gh release edit "$TAG" --repo "$REPOSITORY" --title "$TAG" \
               --target "$TAG_SHA"
            EXISTING_ASSETS=release-publish-diagnostics/assets.json
             gh api --paginate --slurp \
                "repos/$REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
                | jq 'add' >"$EXISTING_ASSETS"
            for artifact in "${ARTIFACTS[@]}"; do
              name=$(basename "$artifact")
              local_digest="sha256:$(sha256sum "$artifact" | cut -d' ' -f1)"
               existing_name=$(jq -r --arg name "$name" \
                 '[.[] | select(.name == $name)] | length' "$EXISTING_ASSETS")
               existing_digest=$(jq -r --arg name "$name" \
                 '.[] | select(.name == $name) | .digest // empty' \
                 "$EXISTING_ASSETS")
               if [ "$existing_name" -gt 0 ] && [ -z "$existing_digest" ]; then
                  printf '%s\n' \
                    "Asset $name exists but has no server digest; refusing " \
                    "blind overwrite. Evidence: $EXISTING_ASSETS" >&2
                 exit 1
               elif [ -n "$existing_digest" ] \
                 && [ "$existing_digest" != "$local_digest" ]; then
                  printf '%s\n' \
                    "Asset $name exists with a different digest; refusing " \
                    "overwrite. Evidence: $EXISTING_ASSETS and " \
                    "release-artifacts.sha256" >&2
                exit 1
              elif [ -z "$existing_digest" ]; then
                gh release upload "$TAG" "$artifact" --repo "$REPOSITORY"
              else
                echo "Keeping matching existing asset $name."
              fi
            done
           else
             gh release create "$TAG" --repo "$REPOSITORY" --title "$TAG" \
               --generate-notes --target "$TAG_SHA" "${ARTIFACTS[@]}"
           fi

      - name: Validate published tag, release, and assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          TAG_SHA: ${{ steps.resolve.outputs.tag_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-validation-diagnostics
          mkdir -p release-validation-diagnostics
          RELEASE_JSON=release-validation-diagnostics/release.json
          ASSETS_JSON=release-validation-diagnostics/assets.json
          EXPECTED_ASSETS=release-validation-diagnostics/expected-assets.txt
          VERSION="${TAG#v}"

          mapfile -t ARTIFACTS < <(find dist-electron -maxdepth 1 -type f \( \
            -name 'Open3DCalc-*.exe' -o -name 'Open3DCalc-*.AppImage' -o \
            -name 'latest*.yml' -o -name '*.blockmap' \) -print | sort)
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "Validation failed: no local release artifacts found." >&2
            exit 1
          fi
          for artifact in "${ARTIFACTS[@]}"; do
            basename "$artifact"
          done | sort >"$EXPECTED_ASSETS"

          TAG_REF=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          if [ "$TAG_REF" != "$TAG_SHA" ]; then
            printf '%s\n' \
              "Validation failed: tag $TAG resolves to $TAG_REF; expected " \
              "$TAG_SHA." >&2
            exit 1
          fi

          if ! gh api "repos/$REPOSITORY/releases/tags/$TAG" \
            >"$RELEASE_JSON"; then
            printf '%s\n' \
              "Validation failed: GitHub Release for $TAG does not exist. " \
              "Tag SHA: $TAG_SHA." >&2
            exit 1
          fi
           RELEASE_TAG=$(jq -r '.tag_name // empty' "$RELEASE_JSON")
           RELEASE_ID=$(jq -r '.id // empty' "$RELEASE_JSON")
           RELEASE_DRAFT=$(jq -r '.draft // true' "$RELEASE_JSON")
           RELEASE_PUBLISHED_AT=$(jq -r \
             '.published_at // empty' "$RELEASE_JSON")
           if [ "$RELEASE_TAG" != "$TAG" ] || [ -z "$RELEASE_ID" ]; then
             printf '%s\n' \
               "Validation failed: Release is not associated with tag $TAG. " \
               "Observed tag=$RELEASE_TAG id=$RELEASE_ID." >&2
             exit 1
           fi
           if [ "$RELEASE_DRAFT" != "false" ] \
             || [ -z "$RELEASE_PUBLISHED_AT" ]; then
             printf '%s\n' \
               "Validation failed: Release $RELEASE_ID is not published (" \
               "draft=$RELEASE_DRAFT published_at=$RELEASE_PUBLISHED_AT)." >&2
             exit 1
           fi

           gh api --paginate --slurp \
             "repos/$REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
             | jq 'add' >"$ASSETS_JSON"
           ASSET_FILTER='map(select(.name == $name)) | '
           ASSET_FILTER+='if length == 1 then .[0] else empty end'
           while IFS= read -r name; do
             asset=$(jq -c --arg name "$name" \
               "$ASSET_FILTER" \
               "$ASSETS_JSON")
             if [ -z "$asset" ]; then
               printf '%s\n' \
                 "Validation failed: expected asset is missing: $name. See " \
                 "$ASSETS_JSON and $EXPECTED_ASSETS." >&2
               exit 1
             fi
             local_digest="sha256:$(sha256sum \
               "dist-electron/$name" | cut -d' ' -f1)"
             remote_digest=$(jq -r '.digest // empty' <<<"$asset")
             if [ -z "$remote_digest" ]; then
               printf '%s\n' \
                 "Validation failed: asset $name has no API digest; refusing " \
                 "to clean up. See $ASSETS_JSON." >&2
               exit 1
             fi
             if [ "$remote_digest" != "$local_digest" ]; then
               printf '%s\n' \
                 "Validation failed: asset $name digest mismatch: API=" \
                 "$remote_digest local=$local_digest." >&2
               exit 1
             fi
             case "$name" in
              Open3DCalc-*)
                case "$name" in
                  Open3DCalc-"$VERSION"*) ;;
                  *)
                    printf '%s\n' \
                      "Validation failed: asset $name does not contain tag " \
                      "version $VERSION." >&2
                    exit 1
                    ;;
                esac
                ;;
            esac
           done <"$EXPECTED_ASSETS"
           printf '%s\n' \
             "Validated published tag $TAG at $TAG_SHA, Release $RELEASE_ID, " \
             "complete asset list, and SHA-256 digest for every expected " \
             "versioned asset."

      - name: Preserve publication diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-publication-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            release-artifacts.sha256
            release-publish-diagnostics/
            release-validation-diagnostics/

      - name: Remove release branch after confirmed publication
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="release/$TAG"
           if gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" \
             >/dev/null 2>&1; then
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$BRANCH"
            echo "Deleted $BRANCH after successful publication."
          else
            echo "$BRANCH does not exist; nothing to clean up."
          fi
