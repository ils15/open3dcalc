---
name: Beta deploy

# Web-only publication for immutable beta tags. The credential-free build job
# validates the exact tag commit against package manifests and current main,
# then produces the /beta/ bundle. A fresh deploy job consumes only that
# artifact and the immutable push-event tag/SHA; it never checks out the repo,
# installs dependencies, or executes project code.

"on":
  push:
    tags:
      - "v*-beta.*"

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  build-beta:
    name: Validate and build web beta (credential-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BETA_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout exact tag commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Validate beta tag, package version, and ancestry of current main
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          if [[ ! "$BETA_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "❌ Refusing non-beta tag: $BETA_TAG" >&2
            exit 1
          fi
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          git fetch --no-tags origin \
            "+refs/tags/$BETA_TAG:refs/tags/$BETA_TAG" \
            "+refs/heads/main:refs/remotes/origin/main"
          tag_sha=$(git rev-parse "$BETA_TAG^{commit}")
          test "$tag_sha" = "$GITHUB_SHA" || {
            echo "❌ Triggering tag does not point to the workflow event SHA." >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "❌ Beta tag commit is not an ancestor of current main." >&2
            exit 1
          }

          package_version=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== lock.version || pkg.version !== lock.packages?.['']?.version) {
            throw new Error('package.json and package-lock.json versions do not match');
          }
          if (!/^\d+\.\d+\.\d+-beta\.\d+$/.test(pkg.version)) {
            throw new Error(`Expected X.Y.Z-beta.N, got ${pkg.version}`);
          }
          process.stdout.write(pkg.version);
          NODE
          )
          if [ "$BETA_TAG" != "v$package_version" ]; then
            echo "❌ Tag $BETA_TAG does not exactly match v$package_version." >&2
            exit 1
          fi
          echo "Validated $BETA_TAG at $GITHUB_SHA as an ancestor of current main."

      # npm lifecycle, test, and build code runs as the image's unprivileged
      # pwuser account in a disposable container. Only trusted compiler setup runs
      # as container root before project code starts.
      # Only a read-only checkout/runtime and a dedicated output directory are
      # mounted: no runner command files, host workspace writes, secrets, or
      # Docker socket. The host validates and copies outputs after the container
      # exits, before the trusted artifact action runs.
      - name: Install, test, and build web beta in isolation
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          node_root=$(dirname -- "$(dirname -- "$(readlink -f -- "$(command -v node)")")")
          case "$node_root/" in
            "$RUNNER_TOOL_CACHE"/node/*/x64/) ;;
            *)
              echo "❌ setup-node runtime is outside the expected hosted tool cache: $node_root." >&2
              exit 1
              ;;
          esac
          [[ "$(node -p 'process.versions.node.split(".")[0]')" = 22 ]]

          container_output=$(mktemp -d "$RUNNER_TEMP/beta-build-output.XXXXXX")
          chmod 777 "$container_output"
          trap 'rm -rf -- "$container_output"' EXIT
          if [ -L beta-artifact ] || [ -e beta-artifact ]; then
            echo "❌ Refusing to reuse a pre-existing beta-artifact path." >&2
            exit 1
          fi

          docker run --rm --init -i --platform linux/amd64 --shm-size=1gb \
            --security-opt=no-new-privileges:true \
            --user root \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/input,readonly" \
            --mount "type=bind,source=$node_root,target=/node,readonly" \
            --mount "type=bind,source=$container_output,target=/output" \
            --env 'PATH=/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' \
            --env HOME=/tmp/beta-home \
            --env TMPDIR=/tmp/beta-tmp \
            --env NPM_CONFIG_CACHE=/tmp/npm-cache \
            --env CI=true \
            --env BASH_ENV=/dev/null \
            --env GIT_CONFIG_NOSYSTEM=1 \
            --env GIT_CONFIG_GLOBAL=/dev/null \
            --env GIT_TERMINAL_PROMPT=0 \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --env VITE_BETA_CHANNEL=true \
            --env VITE_TOOLPATH_PREVIEW=true \
            --workdir /tmp \
            --entrypoint /bin/bash \
            'mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27' \
            --noprofile --norc -euo pipefail -s <<'CONTAINER'
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends build-essential

          test "$(id -u)" = 0
          build_account=$(getent passwd pwuser) || {
            echo '❌ Pinned Playwright image is missing the expected pwuser account.' >&2
            exit 1
          }
          IFS=: read -r build_user _ build_uid build_gid _ _ _ <<< "$build_account"
          if [[ "$build_user" != pwuser || ! "$build_uid" =~ ^[1-9][0-9]*$ || \
                ! "$build_gid" =~ ^[1-9][0-9]*$ ]] || \
             ! getent group "$build_gid" >/dev/null || \
             [[ "$(id -u "$build_user")" != "$build_uid" || \
                "$(id -g "$build_user")" != "$build_gid" ]]; then
            echo '❌ Pinned Playwright image has an invalid pwuser UID/GID mapping.' >&2
            exit 1
          fi
          install -d -m 700 -o "$build_uid" -g "$build_gid" \
            /tmp/beta-work /tmp/beta-home /tmp/beta-tmp /tmp/npm-cache
          runuser --user "$build_user" --preserve-environment -- \
            /bin/bash --noprofile --norc -euo pipefail -s <<'PROJECT'
          cp -R /input/. /tmp/beta-work/
          cd /tmp/beta-work
          test "$(id -u)" -ne 0
          [[ "$(node -p 'process.versions.node.split(".")[0]')" = 22 ]]

          npm ci
          npm run test:browser
          npm run build:web
          cp dist-web/index.web.html dist-web/404.html
          cp dist-web/index.web.html dist-web/index.html

          last_stable=$(git tag --list 'v*.*.*' --sort=-v:refname \
            | awk '!/-/ { print; exit }')
          if [ -n "$last_stable" ]; then
            npx --no-install changelogen --from "$last_stable" --output beta-notes.md
          else
            echo "No stable tag found; shipping an empty beta changelog." >&2
            : > beta-notes.md
          fi

          cp -a dist-web /output/
          cp -a beta-notes.md /output/
          PROJECT
          CONTAINER

          test ! -L "$container_output/dist-web" && test -d "$container_output/dist-web"
          test ! -L "$container_output/beta-notes.md" && test -f "$container_output/beta-notes.md"
          if find "$container_output/dist-web" -type l -print -quit | grep -q . || \
             find "$container_output/dist-web" ! -type f ! -type d -print -quit | grep -q .; then
            echo "❌ Build artifact contains a symlink or special file." >&2
            exit 1
          fi
          mkdir -m 755 beta-artifact
          cp -R --no-preserve=mode,ownership,timestamps \
            "$container_output/dist-web" beta-artifact/
          cp --no-preserve=mode,ownership,timestamps \
            "$container_output/beta-notes.md" beta-artifact/beta-notes.md

      # The publisher receives no values from project code: it reads tag/SHA
      # from the immutable event and consumes only this artifact.
      - name: Upload beta site and release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-site
          path: |
            beta-artifact/dist-web/
            beta-artifact/beta-notes.md
          if-no-files-found: error
          retention-days: 1
        env:
          BASH_ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  deploy-beta:
    name: Publish validated web beta
    needs: build-beta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: beta-release
    permissions:
      contents: write
    env:
      BETA_TAG: ${{ github.ref_name }}
    steps:
      # This job has no checkout, dependency install, or project script. The
      # artifact is the only build input; the tag and SHA come from GitHub's
      # immutable push event and were validated by build-beta.
      - name: Download beta site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: beta-site
          path: beta-artifact

      - name: Verify artifact metadata
        shell: bash
        env:
          BASH_ENV: /dev/null
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          [[ "$BETA_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -d beta-artifact/dist-web
          test ! -L beta-artifact/dist-web
          test -f beta-artifact/dist-web/index.html
          test -f beta-artifact/dist-web/404.html
          test -f beta-artifact/beta-notes.md
          test ! -L beta-artifact/beta-notes.md

          # Recheck the public tag ref and main ancestry immediately before
          # publication. No token is needed for this public repository.
          api_root="$API_URL/repos/$GITHUB_REPOSITORY"
          api_get() {
            local path="$1" destination="$2" status
            status=$(curl --silent --show-error --output "$destination" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api_root/$path")
            if [ "$status" != 200 ]; then
              echo "❌ GitHub API GET $path returned HTTP $status." >&2
              exit 1
            fi
          }
          ref_json=$(mktemp "$RUNNER_TEMP/beta-ref.XXXXXX")
          api_get "git/ref/tags/$BETA_TAG" "$ref_json"
          object_sha=$(jq -er '.object.sha' "$ref_json")
          object_type=$(jq -er '.object.type' "$ref_json")
          resolved=0
          for _ in 1 2 3 4 5; do
            case "$object_type" in
              commit)
                resolved=1
                break
                ;;
              tag)
                tag_json=$(mktemp "$RUNNER_TEMP/beta-tag-object.XXXXXX")
                api_get "git/tags/$object_sha" "$tag_json"
                object_sha=$(jq -er '.object.sha' "$tag_json")
                object_type=$(jq -er '.object.type' "$tag_json")
                ;;
              *)
                echo "❌ Beta tag resolves to unsupported Git object type $object_type." >&2
                exit 1
                ;;
            esac
          done
          [ "$resolved" = 1 ] && [ "$object_sha" = "$GITHUB_SHA" ] || {
            echo "❌ Beta tag no longer points to this run's immutable event SHA." >&2
            exit 1
          }

          main_json=$(mktemp "$RUNNER_TEMP/beta-main.XXXXXX")
          api_get "git/ref/heads/main" "$main_json"
          main_sha=$(jq -er '.object.sha' "$main_json")
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          compare_json=$(mktemp "$RUNNER_TEMP/beta-main-compare.XXXXXX")
          api_get "compare/$GITHUB_SHA...$main_sha" "$compare_json"
          compare_status=$(jq -er '.status' "$compare_json")
          merge_base_sha=$(jq -er '.merge_base_commit.sha' "$compare_json")
          if [[ "$compare_status" != ahead && "$compare_status" != identical ]] || \
             [ "$merge_base_sha" != "$GITHUB_SHA" ]; then
            echo "❌ Beta event SHA is no longer an ancestor of current main." >&2
            exit 1
          fi

      # Only this pinned publisher receives the job's minimum write token. No
      # source checkout or project-controlled executable is present here.
      - name: Publish to gh-pages /beta/
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: beta
          publish_dir: beta-artifact/dist-web
          keep_files: true

      # PAT is exposed to this trusted shell step only, after build and deploy.
      - name: Create or refresh the prerelease
        env:
          GH_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
          BETA_TAG: ${{ github.ref_name }}
          BASH_ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ Secret BETA_RELEASE_TOKEN is not configured for the protected beta-release environment." >&2
            exit 1
          fi
          if gh release view "$BETA_TAG" >/dev/null 2>&1; then
            gh release edit "$BETA_TAG" \
              --prerelease \
              --title "Open3DCalc Beta $BETA_TAG" \
              --notes-file beta-artifact/beta-notes.md
          else
            gh release create "$BETA_TAG" \
              --prerelease \
              --title "Open3DCalc Beta $BETA_TAG" \
              --notes-file beta-artifact/beta-notes.md
          fi
