---
name: Beta deploy

# Web-only beta publication, triggered by the immutable beta tag that
# beta.yml cuts and pushes. Builds the web bundle with VITE_BETA_CHANNEL=true
# (visual beta badge in the app), publishes it under the /beta/ subpath of the
# gh-pages branch and creates (or refreshes) the prerelease GitHub Release whose
# body carries the beta changelog.
#
# The tag filter v*-beta.* matches only vX.Y.Z-beta.N and never a stable
# vX.Y.Z, so this workflow and release-publish.yml are mutually exclusive.
#
# Electron is never built for the beta channel: betas are web-only.
#
# The release step needs the BETA_RELEASE_TOKEN PAT (not the default
# GITHUB_TOKEN): the tag itself was pushed with that PAT, and GITHUB_TOKEN
# would be enough for the gh-pages deploy but cannot reliably create the
# release in the same run. See README.md > Canal Beta.
#
# Re-deploying an already-pushed immutable tag uses workflow_dispatch with the
# "tag" input: a tag cannot be re-pushed to retrigger the push event, and the
# workflow file that runs is the one on the dispatched ref, so the corrected
# copy on the default branch is used. BETA_TAG (job env) resolves the tag for
# both trigger paths and every step reads the tag from it.

"on":
  push:
    tags:
      - "v*-beta.*"

  # Manual re-deploy of an existing beta tag. The tag input is optional only
  # because this same file still serves the push trigger (where it stays
  # empty); a dispatch without it resolves BETA_TAG to the branch name and is
  # rejected by the preflight guard below.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing beta tag to re-deploy (e.g. v1.13.0-beta.1). Required when dispatching manually.'
        required: false
        type: string

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  beta-deploy:
    name: Publish web beta to /beta/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # peaceiris only needs contents: write to push the gh-pages branch; the
      # pages: write scope of the retired deploy-pages job is unused here (the
      # Pages source is the gh-pages branch, not an Actions artifact).
      contents: write
    env:
      # Single source of truth for the beta tag across every step. On a tag
      # push inputs.tag is empty and github.ref_name is the tag that triggered
      # the run; on a manual dispatch it is the tag passed in the input.
      BETA_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Verify beta release token is configured
        env:
          BETA_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
        run: |
          if [ -z "$BETA_TOKEN" ]; then
            echo "❌ Repository secret BETA_RELEASE_TOKEN is not configured." >&2
            echo "   The prerelease for $BETA_TAG cannot be created" >&2
            echo "   without it. See README.md > Canal Beta." >&2
            exit 1
          fi
          # Preflight: the resolved tag must be a beta tag before anything is
          # built or published. A manual dispatch without the tag input
          # resolves to the branch name (e.g. "main"); failing here keeps the
          # release step from ever touching a non-beta release.
          if ! printf '%s' "$BETA_TAG" \
            | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            echo "❌ BETA_TAG \"$BETA_TAG\" is not a beta tag (expected vX.Y.Z-beta.N)." >&2
            echo "   On a manual run, pass the existing tag in the 'tag' input." >&2
            exit 1
          fi

      - name: Checkout beta tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Accepts a tag name: on a dispatch this is the input tag, on a push
          # it is the tag that triggered the run. Detached HEAD at the tag in
          # both cases, so changelogen's implicit --to HEAD is the tag commit.
          ref: ${{ env.BETA_TAG }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.BETA_RELEASE_TOKEN }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (beta channel)
        run: npm run build:web
        env:
          # Visual beta badge in the app; false on stable builds.
          VITE_BETA_CHANNEL: "true"

      - name: SPA routing fallback
        # GitHub Pages serves index.html for directory requests; without it,
        # /open3dcalc/beta/ would fall through to the root 404.html (the stable
        # shell, whose /assets/ do not exist under /beta/). Mirror the pattern
        # used by ci-cd.yml and seed-gh-pages.yml.
        run: |
          cp dist-web/index.web.html dist-web/404.html
          cp dist-web/index.web.html dist-web/index.html

      # keep_files: true so the stable root of gh-pages is never clobbered.
      # The shared gh-pages-deploy concurrency group serializes this with the
      # stable publish in ci-cd.yml and with seed-gh-pages.yml.
      - name: Publish to gh-pages /beta/
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: beta
          # The web build writes to dist-web, not the action default ./public.
          # Without publish_dir the action does fs.readdir('./public') and
          # fails with ENOENT.
          publish_dir: dist-web
          keep_files: true

      - name: Create or refresh the prerelease
        env:
          GH_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # changelogen auto-selects the highest semver tag as the diff start,
          # which is a beta tag once betas exist. --from must pin the last
          # STABLE tag so the beta notes cover everything since the baseline.
          LAST_STABLE=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v '-' | head -1 || true)
          if [ -n "$LAST_STABLE" ]; then
            npx changelogen --from "$LAST_STABLE" --output beta-notes.md || echo "" > beta-notes.md
          else
            echo "No stable tag found; shipping an empty beta changelog." >&2
            echo "" > beta-notes.md
          fi
          # Idempotent: re-running the workflow refreshes the notes in place.
          if gh release view "$BETA_TAG" >/dev/null 2>&1; then
            # Guard: this step must never downgrade a stable release to
            # prerelease. Only beta tags reach this workflow (the v*-beta.*
            # trigger), but refuse explicitly if a non-beta tag slips through.
            if ! printf '%s' "$BETA_TAG" \
              | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
              echo "Tag não-beta encontrada ($BETA_TAG); recusando editar release estável." >&2
              exit 1
            fi
            gh release edit "$BETA_TAG" \
              --prerelease \
              --title "Beta $BETA_TAG" \
              --notes-file beta-notes.md
          else
            gh release create "$BETA_TAG" \
              --prerelease \
              --title "Beta $BETA_TAG" \
              --notes-file beta-notes.md
          fi
